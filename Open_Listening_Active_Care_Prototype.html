<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Listening — Active Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page: #EDEBF5;
    --bg-warm: #FFF8EF;
    --bg-cool: #EEFBF9;
    --amber: #FFB648;
    --coral: #FF6E86;
    --magenta: #FF3D8A;
    --teal: #17B8A6;
    --cyan: #2E86DE;
    --ink: #2A2338;
    --ink-dim: rgba(42,35,56,0.62);
    --card: #FFFFFF;
    --card-border: rgba(42,35,56,0.10);
    --card-hover: rgba(42,35,56,0.04);
    --btn-ink: #2A2338;
    --radius: 20px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    color: var(--ink);
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Fredoka',sans-serif; font-weight:600; letter-spacing:0.2px;}

  /* ---------- Mode toggle ---------- */
  .mode-toggle{
    position:fixed; top:16px; right:16px; z-index:60;
    display:flex; gap:4px; background:#fff; padding:5px; border-radius:100px;
    box-shadow:0 8px 24px rgba(42,35,56,0.15);
  }
  .mode-btn{
    border:none; background:transparent; padding:9px 14px; border-radius:100px;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:12.5px; cursor:pointer; color:#9A93A8;
    transition: all .2s ease;
  }
  .mode-btn.active{ background:linear-gradient(90deg,var(--amber),var(--coral)); color:#2A2338; }

  /* ---------- Page & device frame ---------- */
  .page{
    min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
    background: var(--bg-page); padding:48px 16px;
  }
  .device-frame{
    width:100%; max-width:412px; background: var(--bg-warm);
    border-radius:42px; border:9px solid #241F2E; box-shadow:0 30px 70px rgba(42,35,56,0.28);
    overflow-y:auto; max-height:860px; position:relative;
    transition: background 1s ease, max-width .35s ease, border-radius .35s ease, border-width .35s ease, box-shadow .35s ease;
  }
  .device-frame::before{
    content:''; position:sticky; top:0; display:block; margin:0 auto; width:130px; height:24px;
    background:#241F2E; border-radius:0 0 16px 16px; z-index:35;
  }
  .device-frame.phase-cool{ background: var(--bg-cool); }

  .page.mode-desktop{ align-items:stretch; }
  .page.mode-desktop .device-frame{
    max-width:820px; border-radius:24px; border:1px solid var(--card-border); max-height:none; overflow:visible;
    box-shadow:0 24px 60px rgba(42,35,56,0.12);
  }
  .page.mode-desktop .device-frame::before{ display:none; }
  .page.mode-desktop .app{ padding-top:0; }
  .page.mode-desktop .screen{ padding:22px 64px 50px; max-width:640px; margin:0 auto; }
  .page.mode-desktop .q-title{ font-size:26px; }
  .page.mode-desktop .intro{ min-height:640px; }
  .page.mode-desktop .options{ }

  .app{ display:flex; flex-direction:column; padding-top:26px; }

  /* ---------- HUD ---------- */
  .hud{
    position:sticky; top:0; z-index:20; padding:14px 20px 12px;
    background:linear-gradient(180deg, rgba(255,248,239,0.95), rgba(255,248,239,0));
    backdrop-filter: blur(6px);
  }
  .device-frame.phase-cool .hud{ background:linear-gradient(180deg, rgba(238,251,249,0.95), rgba(238,251,249,0)); }
  .hud-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .hud-brand-wrap{ display:flex; align-items:center; gap:8px; }
  .hud-logo{ width:20px; height:20px; flex-shrink:0; opacity:0.9; }
  .brand{ font-family:'Fredoka',sans-serif; font-size:13px; font-weight:600; color:var(--ink-dim); letter-spacing:0.4px; text-transform:uppercase;}
  .brand b{ color:var(--ink); }
  .progress-track{ height:5px; border-radius:6px; background:rgba(42,35,56,0.08); overflow:hidden;}
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--amber), var(--magenta)); transition:width .5s ease;}
  .device-frame.phase-cool .progress-fill{ background:linear-gradient(90deg, var(--teal), var(--cyan)); }

  /* ---------- Screens ---------- */
  .screen{ display:none; flex-direction:column; padding:8px 22px 34px; animation: fadeUp .45s ease;}
  .screen.active{ display:flex; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }

  .intro{ justify-content:flex-start; align-items:center; text-align:center; min-height:80vh; gap:18px; position:relative; padding-top:44px;}
  .intro-badge{ font-size:11.5px; letter-spacing:1.1px; text-transform:uppercase; color:#C9862B; background:rgba(255,182,72,0.18); padding:6px 14px; border-radius:100px; font-weight:600;}
  .intro h1{ font-size:29px; line-height:1.18; }
  .intro h1 span{ background:linear-gradient(90deg,#E88A00,var(--magenta)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .intro p{ color:var(--ink-dim); font-size:15px; line-height:1.55; max-width:340px;}
  .intro p span{ font-weight:700; background:linear-gradient(90deg,#E88A00,var(--magenta)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .intro-logo{ width:110px; opacity:0.9; margin-bottom:6px; }
  .modal-overlay{ display:none; position:absolute; inset:0; background:rgba(20,14,8,0.55); z-index:50; align-items:center; justify-content:center; padding:24px; backdrop-filter:blur(2px); }
  .modal-overlay.show{ display:flex; }
  .modal-card{ background:#fff; border-radius:20px; padding:26px 22px; max-width:320px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.25); animation:modalIn 0.25s ease; }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(10px) scale(0.97);} to{ opacity:1; transform:translateY(0) scale(1);} }
  .modal-badge{ display:inline-block; font-size:11px; letter-spacing:1px; text-transform:uppercase; font-weight:700; color:#B8511C; background:rgba(255,138,54,0.16); padding:5px 12px; border-radius:100px; margin-bottom:10px; }
  .modal-icon{ font-size:30px; margin-bottom:6px; }
  .modal-card h3{ font-size:18px; margin:4px 0 12px; color:var(--ink); }
  .modal-card p{ font-size:13.5px; line-height:1.55; color:var(--ink-dim); margin:0 0 10px; text-align:left; }
  .modal-input-label{ font-size:12px; font-weight:600; color:var(--ink-dim); margin:2px 0 6px; text-align:left; }
  .modal-fields{ display:flex; flex-direction:column; gap:8px; margin:4px 0 14px; }
  .modal-input{ width:100%; padding:11px 13px; border-radius:12px; border:1.5px solid rgba(42,35,56,0.15); font-size:14px; font-family:inherit; color:var(--ink); background:#FAF8F6; box-sizing:border-box; }
  .modal-input:focus{ outline:none; border-color:#E88A00; background:#fff; }
  .modal-callout{ display:flex; gap:9px; align-items:flex-start; text-align:left; background:rgba(23,184,166,0.10); border-left:3px solid var(--teal,#17B8A6); border-radius:10px; padding:11px 12px; margin:2px 0 14px; font-size:12.5px; line-height:1.5; color:var(--ink); }
  .modal-callout-icon{ font-size:15px; line-height:1.4; flex-shrink:0; }
  .modal-card .btn{ margin-top:0; width:100%; }
  .modal-card .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .battery-hero{ width:108px; height:180px; border:5px solid rgba(42,35,56,0.5); border-radius:22px; position:relative; overflow:hidden; display:flex; align-items:flex-end; padding:7px; background:rgba(42,35,56,0.03);}
  .battery-hero::after{ content:''; position:absolute; top:-14px; left:50%; transform:translateX(-50%); width:40px; height:12px; background:rgba(42,35,56,0.5); border-radius:6px 6px 0 0;}
  .battery-hero-fill{ width:100%; height:14%; border-radius:12px; background:linear-gradient(180deg, var(--coral), var(--amber)); animation:pulseFill 2.4s ease-in-out infinite alternate;}
  @keyframes pulseFill{ from{height:10%;} to{height:22%;} }

  .btn{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:15.5px; border:none; cursor:pointer; padding:15px 26px; border-radius:100px; color:var(--btn-ink); background:linear-gradient(90deg,var(--amber),var(--coral)); box-shadow:0 10px 26px rgba(255,110,134,0.30); transition: transform .15s ease, box-shadow .15s ease;}
  .btn:hover{ transform:translateY(-2px); }
  .btn:active{ transform:translateY(0) scale(.98); }
  .btn.cool{ background:linear-gradient(90deg,var(--teal),var(--cyan)); box-shadow:0 10px 26px rgba(46,134,222,0.28); color:#12232B;}
  .btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--card-border); box-shadow:none;}
  .btn:disabled{ opacity:0.35; cursor:not-allowed; box-shadow:none; transform:none;}

  .q-eyebrow{ font-size:11.5px; text-transform:uppercase; letter-spacing:1px; color:#C9862B; font-weight:600; margin-bottom:8px;}
  .device-frame.phase-cool .q-eyebrow{ color:#0F8F80; }
  .q-eyebrow-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .q-eyebrow-row .q-eyebrow{ margin-bottom:0; }
  .q-eyebrow-badge{ font-size:10.5px; font-weight:700; letter-spacing:0.6px; color:#fff; background:linear-gradient(90deg,var(--amber),var(--coral)); padding:3px 10px; border-radius:100px; white-space:nowrap; }
  .q-title{ font-size:21px; margin-bottom:6px; line-height:1.28;}
  .q-sub{ color:var(--ink-dim); font-size:14px; margin-bottom:22px; line-height:1.5;}

  .options{ display:flex; flex-direction:column; gap:11px; margin-bottom:20px;}
  .opt-card{ display:flex; align-items:center; gap:14px; padding:15px; border-radius:16px; background:var(--card); border:1.5px solid var(--card-border); cursor:pointer; transition:all .16s ease; text-align:left; box-shadow:0 1px 3px rgba(42,35,56,0.04);}
  .opt-card:hover{ background:var(--card-hover); transform:translateY(-1px);}
  .opt-card.selected{ border-color:var(--coral); background:rgba(255,110,134,0.10); box-shadow:0 0 0 1.5px var(--coral) inset;}
  .device-frame.phase-cool .opt-card.selected{ border-color:var(--teal); background:rgba(23,184,166,0.10); box-shadow:0 0 0 1.5px var(--teal) inset;}
  .opt-icon{ font-size:25px; width:38px; text-align:center; flex-shrink:0;}
  .opt-text b{ display:block; font-size:15px; font-family:'Fredoka',sans-serif; font-weight:600;}
  .opt-text span{ display:block; font-size:12.5px; color:var(--ink-dim); margin-top:2px; line-height:1.4;}
  .opt-check{ margin-left:auto; width:21px; height:21px; border-radius:50%; border:2px solid rgba(42,35,56,0.22); flex-shrink:0;}
  .opt-card.selected .opt-check{ background:var(--coral); border-color:var(--coral);}
  .device-frame.phase-cool .opt-card.selected .opt-check{ background:var(--teal); border-color:var(--teal);}

  .altro-input{ margin-top:2px; margin-bottom:14px; width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--card-border); background:#fff; color:var(--ink); font-family:'Inter'; font-size:14px;}
  .altro-input:focus{ outline:none; border-color:var(--coral);}
  .device-frame.phase-cool .altro-input:focus{ border-color:var(--teal); }
  .altro-hint{ font-size:12px; color:var(--coral); margin:-10px 0 14px 4px; font-weight:600;}
  .device-frame.phase-cool .altro-hint{ color:#0F8F80; }

  .slider-wrap{ margin-bottom:22px;}
  .slider-display{ text-align:center; padding:24px 16px; border-radius:20px; background:var(--card); border:1.5px solid var(--card-border); margin-bottom:16px;}
  .mascot-wrap{ width:100px; height:118px; margin:0 auto 8px; }
  .mascot-wrap svg{ width:100%; height:100%; overflow:visible; }
  .slider-value{ font-family:'Fredoka',sans-serif; font-size:26px; font-weight:700; margin-bottom:6px;}
  .slider-msg{ font-size:13.5px; color:var(--ink-dim); line-height:1.5; min-height:40px;}
  .mascot-tired{ animation: mascotDroop 2.6s ease-in-out infinite; transform-origin:center bottom; }
  .mascot-idle{ animation: mascotBob 2.4s ease-in-out infinite; transform-origin:center bottom; }
  .mascot-good{ animation: mascotBounce 1.5s ease-in-out infinite; transform-origin:center bottom; }
  .mascot-hyper{ animation: mascotBounceBig 0.9s ease-in-out infinite; transform-origin:center bottom; }
  @keyframes mascotDroop{ 0%,100%{ transform:translateY(0) rotate(-3deg);} 50%{ transform:translateY(3px) rotate(-1deg);} }
  @keyframes mascotBob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-3px);} }
  @keyframes mascotBounce{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  @keyframes mascotBounceBig{ 0%,100%{ transform:translateY(0) scale(1);} 50%{ transform:translateY(-10px) scale(1.05);} }
  @keyframes sparklePulse{ 0%,100%{ opacity:0.35; transform:scale(0.85);} 50%{ opacity:1; transform:scale(1.15);} }
  .mascot-spark{ animation: sparklePulse 1.1s ease-in-out infinite; transform-origin:center; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:9px; border-radius:6px; background:linear-gradient(90deg,#D8D3E4,var(--amber),var(--coral)); outline:none; margin-top:4px;}
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff; border:4px solid var(--coral); cursor:pointer; box-shadow:0 4px 10px rgba(42,35,56,0.25);}
  .scale-labels{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-dim); margin-top:8px;}

  .likert{ display:flex; gap:8px; margin-bottom:10px;}
  .likert-btn{ flex:1; aspect-ratio:1/1; border-radius:14px; border:1.5px solid var(--card-border); background:var(--card); color:var(--ink); font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s ease;}
  .likert-btn:hover{ background:var(--card-hover); }
  .likert-btn.selected{ background:linear-gradient(135deg,var(--amber),var(--coral)); color:#2A2338; border-color:transparent; transform:scale(1.06);}
  .device-frame.phase-cool .likert-btn.selected{ background:linear-gradient(135deg,var(--teal),var(--cyan)); color:#0E2530;}
  .likert-labels{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-dim); margin-bottom:22px;}

  .nps-grid{ display:grid; grid-template-columns:repeat(11,1fr); gap:5px; margin-bottom:10px;}
  .nps-btn{ aspect-ratio:1/1; border-radius:8px; border:1.5px solid var(--card-border); background:var(--card); color:var(--ink); font-size:12px; font-weight:600; cursor:pointer;}
  .nps-btn.selected{ background:linear-gradient(135deg,var(--teal),var(--cyan)); color:#0E2530; border-color:transparent;}

  .footer-nav{ margin-top:auto; display:flex; gap:10px; padding-top:8px;}
  .footer-nav .btn{ flex:1;}
  .counter-pill{ font-size:11.5px; color:var(--ink-dim); text-align:center; margin-bottom:12px;}

  .chapter{ justify-content:center; align-items:center; text-align:center; min-height:64vh; gap:14px;}
  .chapter-icon{ font-size:42px;}
  .chapter h2{ font-size:23px;}
  .chapter p{ color:var(--ink-dim); font-size:14px; max-width:300px; line-height:1.5;}

  .chapter-mascot-stage{ width:210px; height:140px; }
  .chapter-mascot-stage.large{ width:270px; height:190px; }
  .q1intro{ justify-content:center; align-items:center; text-align:center; min-height:64vh; gap:16px;}
  .q1intro-mascot{ width:210px; height:140px; }
  .q1intro-mascot svg{ width:100%; height:100%; overflow:visible; }
  .q1intro h2{ font-size:19px; max-width:300px; line-height:1.4; color:var(--ink); }
  .q1i-rotate{ animation: chmSpin 14s linear infinite; transform-origin:100px 80px; }
  .chapter-mascot-stage svg{ width:100%; height:100%; overflow:visible; }
  .chm-walk-a{ animation: chmWalk 1.1s ease-in-out infinite; transform-origin:center bottom; }
  .chm-walk-b{ animation: chmWalk 1.1s ease-in-out infinite; animation-delay:0.3s; transform-origin:center bottom; }
  @keyframes chmWalk{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }
  .chm-bubble{ animation: chmBubble 1.6s ease-in-out infinite; transform-origin:center; }
  @keyframes chmBubble{ 0%,100%{ opacity:0.4; transform:scale(0.85);} 50%{ opacity:1; transform:scale(1.05);} }
  .chm-idea-glow{ animation: chmGlow 1.4s ease-in-out infinite; transform-origin:168px 30px; }
  @keyframes chmGlow{ 0%,100%{ opacity:0.55; transform:scale(0.92);} 50%{ opacity:1; transform:scale(1.08);} }
  .chm-gear{ animation: chmSpin 4s linear infinite; transform-origin:182px 46px; }
  @keyframes chmSpin{ to{ transform:rotate(360deg);} }
  .chm-wifi{ animation: chmBubble 1.5s ease-in-out infinite; }
  .chm-arrow-in{ animation: chmDown 1.3s ease-in-out infinite; }
  @keyframes chmDown{ 0%,100%{ transform:translateY(0); opacity:0.6;} 50%{ transform:translateY(6px); opacity:1;} }
  .chm-arrow-out{ animation: chmUp 1.3s ease-in-out infinite; animation-delay:0.15s; }
  @keyframes chmUp{ 0%,100%{ transform:translateY(0); opacity:0.6;} 50%{ transform:translateY(-6px); opacity:1;} }
  .chm-road-dash{ animation: chmDash 1s linear infinite; }
  .chm-eyes-scan{ animation: chmEyesScan 3s ease-in-out infinite; transform-origin:120px 58px; }
  @keyframes chmEyesScan{ 0%,20%{ transform:translateX(-6px);} 45%,55%{ transform:translateX(0px);} 80%,100%{ transform:translateX(6px);} }
  @keyframes chmDash{ to{ stroke-dashoffset:-20; } }
  .chm-finish-run{ animation: chmRun 0.9s ease-in-out infinite; }
  @keyframes chmRun{ 0%,100%{ transform:translateX(0) translateY(0);} 50%{ transform:translateX(4px) translateY(-3px);} }
  .chm-dust{ animation: chmBubble 0.9s ease-in-out infinite; }

  .chapterset{ display:flex; flex-direction:column; }
  .cs-block{ padding:16px 0; border-bottom:1px solid var(--card-border); }
  .cs-block:last-of-type{ border-bottom:none; }
  .cs-alert{ display:flex; align-items:flex-start; gap:6px; background:rgba(255,182,72,0.16); border-left:3px solid var(--amber); border-radius:10px; padding:9px 11px; margin-bottom:10px; font-size:12.5px; font-weight:600; color:#8A5A17; line-height:1.4; }
  .cs-title{ font-size:15.5px; font-weight:600; color:var(--ink); line-height:1.4; margin-bottom:4px; }
  .cs-sub{ font-size:12.5px; color:var(--ink-dim); margin-bottom:10px; }
  .cs-widget{ margin-top:8px; margin-bottom:0; }
  .cs-widget .likert-labels{ margin-bottom:2px; }
  .cs-widget .nps-grid{ margin-bottom:6px; }
  .cs-widget .scale-labels{ margin-top:6px; margin-bottom:0; }
  .cs-widget .altro-hint{ margin:-6px 0 8px 4px; }
  .cs-widget .altro-input{ margin-bottom:2px; }
  .options.compact{ gap:7px; margin-bottom:6px; }
  .opt-card.compact{ padding:10px 13px; border-radius:12px; }

  .transition{ justify-content:center; align-items:center; text-align:center; min-height:82vh; gap:18px;}
  .lock-wrap{ width:82px; height:82px; border-radius:50%; background:rgba(23,184,166,0.14); display:flex; align-items:center; justify-content:center; font-size:34px; animation:lockPop .55s cubic-bezier(.34,1.56,.64,1);}
  @keyframes lockPop{ 0%{transform:scale(.4); opacity:0;} 100%{transform:scale(1); opacity:1;} }
  .network-svg path{ stroke-dasharray:6 6; animation:dash 1.6s linear infinite;}
  @keyframes dash{ to{ stroke-dashoffset:-24; } }
  .transition h2{ font-size:23px;}
  .transition p{ color:var(--ink-dim); font-size:14px; max-width:320px; line-height:1.6;}
  .microcopy{ font-size:11.5px; color:rgba(42,35,56,0.45); max-width:290px;}

  .result-screen{ justify-content:center; align-items:center; text-align:center; min-height:82vh; gap:14px; padding:0 6px;}
  .result-icon{ font-size:34px; }
  .result-screen h2{ font-size:21px; margin:0; color:var(--ink); }
  .result-title-brand{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:24px; background:linear-gradient(90deg,#E88A00,var(--magenta)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .result-card{ background:var(--card); border:1.5px solid var(--card-border); border-radius:18px; padding:18px 18px; max-width:330px; text-align:left; }
  .result-card p{ font-size:14.5px; line-height:1.65; color:var(--ink); margin:0 0 8px; }
  .result-card p:last-child{ margin-bottom:0; }
  .result-note{ font-size:12px; color:rgba(42,35,56,0.5); max-width:300px; line-height:1.5; }
  .result-screen .btn{ margin-top:4px; }

  .result-reveal{ opacity:0; transform:translateY(10px); transition:opacity .45s ease, transform .45s ease; }
  .result-reveal.show{ opacity:1; transform:translateY(0); }
  .result-mascot-stage{ position:relative; width:150px; height:184px; margin:2px auto 0; }
  .result-reveal-mascot{ opacity:0; transform:scale(0.6) translateY(10px); transition:opacity .55s cubic-bezier(.34,1.56,.64,1), transform .55s cubic-bezier(.34,1.56,.64,1); }
  .result-reveal-mascot.show{ opacity:1; transform:scale(1) translateY(0); }
  .result-mascot-stage .mascot-wrap{ width:150px; height:180px; }
  .result-calm-glow{ position:absolute; inset:6px -14px; border-radius:50%; background:radial-gradient(circle, rgba(150,190,255,0.32), transparent 70%); animation:calmPulse 3.2s ease-in-out infinite; z-index:0; }
  @keyframes calmPulse{ 0%,100%{ transform:scale(0.92); opacity:0.55;} 50%{ transform:scale(1.08); opacity:0.9;} }
  .confetti-piece{ position:absolute; top:-4px; font-size:15px; opacity:0; animation:confettiFall 1.7s ease-in forwards; pointer-events:none; z-index:2; }
  @keyframes confettiFall{ 0%{ transform:translateY(-8px) rotate(0deg); opacity:0;} 12%{ opacity:1;} 100%{ transform:translateY(150px) rotate(220deg); opacity:0;} }

  .end{ justify-content:center; align-items:center; text-align:center; min-height:82vh; gap:16px;}
  .end h1{ font-size:26px;}
  .end p{ color:var(--ink-dim); font-size:14.5px; max-width:320px; line-height:1.6;}
  .confetti-battery{ font-size:58px; animation: floatY 2.4s ease-in-out infinite;}
  .end-stage{ position:relative; width:220px; height:170px; margin:0 auto; }
  .end-hr-duo{ width:100%; height:100%; overflow:visible; }
  .end-figure{ animation: endBounce 1.4s ease-in-out infinite; transform-origin:center bottom; }
  .end-figure-b{ animation-delay:0.25s; }
  @keyframes endBounce{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }
  .end-thumb{ animation: endThumb 1.1s ease-in-out infinite; transform-origin:center; }
  @keyframes endThumb{ 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(-6deg);} }
  .end-badge{ display:inline-block; font-family:'Fredoka',sans-serif; font-weight:800; font-size:28px; padding:6px 24px; border-radius:100px; background:linear-gradient(90deg,#FFB648,#FF3D8A); color:#fff; box-shadow:0 8px 20px rgba(255,61,138,0.35); animation: endBadgePop 0.7s cubic-bezier(.34,1.56,.64,1); }
  @keyframes endBadgePop{ 0%{ transform:scale(0.3) rotate(-8deg); opacity:0;} 60%{ transform:scale(1.15) rotate(3deg); opacity:1;} 100%{ transform:scale(1) rotate(0deg); opacity:1;} }
  @keyframes floatY{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-9px);} }

  ::selection{ background: var(--coral); color:#fff;}
  @media (max-width:380px){ .nps-grid{ grid-template-columns:repeat(6,1fr);} }
</style>
</head>

/* ======================= STATE ======================= */
let flow = [];
let idx = 0;
const answers = {};

function buildFlow(){
  flow.push({kind:'intro'});
  step1.forEach(q=>{
    if(q.id==='clima') flow.push({kind:'q1intro', key:'team'});
    flow.push({kind:'q1', q});
    if(q.id==='causa') flow.push({kind:'q1intro', key:'anno'});
  });
  flow.push({kind:'result'});
  flow.push({kind:'transition'});
  let currentChapterKey = null;
  let currentGroup = [];
  function flushGroup(){
    if(currentGroup.length){
      flow.push({kind:'chapterSet', key: currentChapterKey, questions: currentGroup});
      currentGroup = [];
    }
  }
  step2.forEach(q=>{
    if(q.chapter && q.chapter !== currentChapterKey){
      flushGroup();
      flow.push({kind:'chapter', key:q.chapter});
      currentChapterKey = q.chapter;
    }
    currentGroup.push(q);
  });
  flushGroup();
  flow.push({kind:'end'});
}
buildFlow();

const totalQ2 = step2.length;

  modalOkBtn.disabled = !(modalNomeInput.value.trim() && modalCognomeInput.value.trim());
}

  userNome = modalNomeInput.value.trim();
  userCognome = modalCognomeInput.value.trim();

  idx++; render();
};

function setPhase(cool){
  deviceFrame.classList.toggle('phase-cool', cool);
  hudPhaseLabel.textContent = '';
}

function updateHud(){
  const step = flow[idx];
  hud.style.display = (step.kind==='intro') ? 'none' : 'block';
  let pct, isCool;
  if(step.kind==='q1' || step.kind==='q1intro'){
    const answeredQ1 = step1.filter(q=>answers[q.id]!==undefined).length;
    pct = Math.round((answeredQ1/totalQ1)*100);
    isCool=false;
  } else if(step.kind==='q2' || step.kind==='chapter' || step.kind==='chapterSet'){
    const answeredQ2 = step2.filter(q=>answers[q.id]!==undefined).length;
    pct = Math.round((answeredQ2/totalQ2)*100);
    isCool=true;
  } else if(step.kind==='result'){
    pct=100; isCool=false;
  } else if(step.kind==='transition'){
    pct=100; isCool=false;
  } else { pct=0; isCool=false; }
  setPhase(isCool);
  progressFill.style.width = pct+'%';
}

let mascotIdSeq = 0;
function mascotBucket(level){
  if(level<=2) return 'low';
  if(level<=4) return 'lowmid';
  if(level<=6) return 'mid';
  if(level<=8) return 'good';
  return 'high';
}
function mascotAnimClass(level){
  const b = mascotBucket(level);
  if(b==='low' || b==='lowmid') return 'mascot-tired';
  if(b==='mid') return 'mascot-idle';
  if(b==='good') return 'mascot-good';
  return 'mascot-hyper';
}
function mascotColor(level){
  const hue = Math.round((level-1)/9*160);
  return { body:`hsl(${hue},70%,55%)`, light:`hsl(${hue},75%,93%)`, fill:`hsl(${hue},75%,48%)` };
}

  else if(step.kind==='q2') renderQ(el, step.q, 'q2');

function renderQ1Intro(el, key){
  el.classList.add('q1intro');
  const title = key==='team'
    ? "Ora ti chiediamo di concentrarti sul clima attuale del tuo team"
    : "Ora ti chiediamo di concentrarti sul tuo ultimo anno";
  el.innerHTML = `
    <div class="q1intro-mascot">${q1IntroMascotSVG(key)}</div>
    <h2>${title}</h2>
    <button class="btn" id="nextBtn">Continua</button>
  `;
  el.querySelector('#nextBtn').onclick = ()=>{ idx++; render(); };
}

function renderChapterSet(el, key, questions){
  const c = chapters[key];
  el.classList.add('chapterset');
  el.innerHTML = `
    <div class="q-eyebrow">${c.title}</div>
    <div id="csBody"></div>
    <div class="footer-nav">
      <button class="btn ghost" id="backBtn">Indietro</button>
      <button class="btn cool" id="nextBtn" disabled>Continua</button>
    </div>
  `;
  const body = el.querySelector('#csBody');
  const nextBtn = el.querySelector('#nextBtn');
  el.querySelector('#backBtn').onclick = ()=>{ idx--; render(); };

  function isAnswered(q){
    if(q.type==='multi' || q.type==='multi-icon'){
      const arr = answers[q.id];
      if(!arr || !arr.length) return false;
      const altroLabel = q.type==='multi-icon' ? (q.options.find(o=>o.hasInput)||{}).label : q.hasInputOn;
      if(altroLabel && arr.includes(altroLabel) && !(answers[q.id+'_altro']||'').trim()) return false;
      return true;
    }
    if(q.optional) return true;
    return answers[q.id] !== undefined;
  }
  function checkAllValid(){
    nextBtn.disabled = !questions.every(isAnswered);
  }

  questions.forEach(q=>{
    const block = document.createElement('div'); block.className='cs-block';
    block.innerHTML = `${q.alert ? `<div class="cs-alert">⚠️ ${q.alert}</div>` : ''}<div class="cs-title">${q.title}</div>${q.sub?`<div class="cs-sub">${q.sub}</div>`:''}`;
    const widgetHolder = document.createElement('div'); widgetHolder.className='cs-widget';
    block.appendChild(widgetHolder);
    body.appendChild(block);

    if(q.type==='single'){
      const wrap = document.createElement('div'); wrap.className='options compact';
      q.options.forEach(opt=>{
        const card = document.createElement('div'); card.className='opt-card compact';
        card.innerHTML = `<div class="opt-text" style="flex:1"><b>${opt}</b></div><div class="opt-check"></div>`;
        if(answers[q.id]===opt) card.classList.add('selected');
        card.onclick = ()=>{
          answers[q.id]=opt;
          [...wrap.children].forEach(c=>c.classList.remove('selected'));
          card.classList.add('selected');
          checkAllValid(); updateHud();
        };
        wrap.appendChild(card);
      });
      widgetHolder.appendChild(wrap);
    }

    else if(q.type==='likert5'){
      const labels = q.scaleLabels || ['Completamente in disaccordo','Completamente in accordo'];
      widgetHolder.innerHTML = `<div class="likert"></div><div class="likert-labels"><span>${labels[0]}</span><span>${labels[1]}</span></div>`;
      const row = widgetHolder.querySelector('.likert');
      for(let i=1;i<=5;i++){
        const b = document.createElement('button'); b.className='likert-btn'; b.textContent=i;
        if(answers[q.id]===i) b.classList.add('selected');
        b.onclick = ()=>{
          answers[q.id]=i;
          [...row.children].forEach(c=>c.classList.remove('selected'));
          b.classList.add('selected');
          checkAllValid(); updateHud();
        };
        row.appendChild(b);
      }
    }

    else if(q.type==='multi'){
      let selected = answers[q.id] ? [...answers[q.id]] : [];
      const altroLabel = q.hasInputOn;
      const wrap = document.createElement('div'); wrap.className='options compact';
      const inputEl = document.createElement('input');
      inputEl.className='altro-input'; inputEl.placeholder='Scrivi qui la tua risposta…'; inputEl.style.display='none';
      inputEl.value = answers[q.id+'_altro'] || '';
      const hint = document.createElement('div'); hint.className='altro-hint'; hint.style.display='none';
      hint.textContent = '✏️ Scrivi qualcosa per continuare';

      function refresh(){
        [...wrap.children].forEach((c,i)=>{
          c.classList.toggle('selected', selected.includes(q.options[i]));
        });
        answers[q.id] = selected.length ? selected : undefined;
        const altroActive = altroLabel && selected.includes(altroLabel);
        inputEl.style.display = altroActive ? 'block' : 'none';
        hint.style.display = (altroActive && !inputEl.value.trim()) ? 'block' : 'none';
        checkAllValid();
      }
      inputEl.oninput = ()=>{ answers[q.id+'_altro']=inputEl.value; refresh(); };

      q.options.forEach(opt=>{
        const card = document.createElement('div'); card.className='opt-card compact';
        card.innerHTML = `<div class="opt-text" style="flex:1"><b>${opt}</b></div><div class="opt-check"></div>`;
        card.onclick = ()=>{
          const max = q.max || 99;
          if(selected.includes(opt)){
            selected = selected.filter(o=>o!==opt);
          } else {
            if(selected.length>=max) return;
            selected.push(opt);
          }
          refresh();
        };
        wrap.appendChild(card);
      });
      widgetHolder.appendChild(wrap);
      widgetHolder.appendChild(hint);
      widgetHolder.appendChild(inputEl);
      refresh();
    }

    else if(q.type==='nps'){
      widgetHolder.innerHTML = `<div class="nps-grid"></div><div class="scale-labels"><span>Per niente probabile</span><span>Estremamente probabile</span></div>`;
      const grid = widgetHolder.querySelector('.nps-grid');
      for(let i=0;i<=10;i++){
        const b = document.createElement('button'); b.className='nps-btn'; b.textContent=i;
        if(answers[q.id]===i) b.classList.add('selected');
        b.onclick = ()=>{
          answers[q.id]=i;
          [...grid.children].forEach(c=>c.classList.remove('selected'));
          b.classList.add('selected');
          checkAllValid(); updateHud();
        };
        grid.appendChild(b);
      }
    }
  });

  checkAllValid();
  nextBtn.onclick = ()=>{ idx++; render(); };
}

function renderResult(el){
  el.classList.add('result-screen');
  const term = answers['termometro'] || 5;
  const bucket = mascotBucket(term);
  const bucketPhrases = {
    low: 'Oggi senti la batteria piuttosto scarica',
    lowmid: 'In questo periodo l\'energia gira un po\' al minimo',
    mid: 'In questo momento l\'energia procede a un ritmo regolare',
    good: 'C\'è una bella carica addosso in questo periodo',
    high: 'L\'energia è alle stelle in questo momento'
  };
  const climaPhrases = {
    'Soleggiato': 'e l\'aria che si respira intorno a te è leggera e distesa',
    'Parzialmente nuvoloso': 'anche se qualche nuvola, di tanto in tanto, si fa sentire',
    'Piovoso': 'con qualche nube di troppo all\'orizzonte',
    'Temporalesco': 'e il clima intorno pesa più del solito'
  };
  const trendPhrases = {
    'Energia in Crescita': 'la stai facendo crescere, passo dopo passo',
    'Energia Stabile': 'la stai mantenendo su un binario stabile',
    'Energia in Ricarica': 'senti che ha bisogno di una pausa per ricaricarsi',
    'Energia in Assestamento': 'la stai riequilibrando su basi nuove'
  };
  const climaTxt = climaPhrases[answers['clima']] || '';
  const trendTxt = trendPhrases[answers['descrizione']] || '';
  const causaArr = answers['causa'] || [];

  let mainSentence = `${bucketPhrases[bucket]}${climaTxt ? ', ' + climaTxt : ''}.`;

  let secondSentence = '';
  if(trendTxt) secondSentence = `Guardando ai mesi passati, ${trendTxt}.`;

  let causaSentence = '';
  if(causaArr.length){
    causaSentence = `Il peso maggiore, oggi, lo porta <b>${causaArr[0].toLowerCase()}</b>${causaArr[1] ? `, insieme a <b>${causaArr[1].toLowerCase()}</b>` : ''}.`;
  }

  const isUplifting = (bucket==='good' || bucket==='high');
  const isLow = (bucket==='low' || bucket==='lowmid');

  let confettiHTML = '';
  if(isUplifting){
    const pieces = ['✨','⭐','✨','⭐','✨'];
    confettiHTML = pieces.map((e,i)=>`<span class="confetti-piece" style="left:${8+i*20}%; animation-delay:${0.9+i*0.15}s;">${e}</span>`).join('');
  }
  const calmGlowHTML = isLow ? `<div class="result-calm-glow"></div>` : '';

  el.innerHTML = `
    <div class="result-mascot-stage">
      ${calmGlowHTML}
      <div class="result-reveal-mascot" id="rMascotStage">
        <div class="mascot-wrap ${mascotAnimClass(term)}" id="rMascot">${mascotSVG(term)}</div>
      </div>
      ${confettiHTML}
    </div>
    <h2 class="result-reveal result-title-brand" id="rTitle">My Energy Battery</h2>
    <div class="result-card result-reveal" id="rCard">
      <p>${mainSentence}</p>
      ${secondSentence ? `<p>${secondSentence}</p>` : ''}
      ${causaSentence ? `<p>${causaSentence}</p>` : ''}
    </div>
    <button class="btn result-reveal" id="resultBtn" disabled>Prosegui</button>
  `;

  const seq = [
    {sel:'#rMascotStage', delay:80},
    {sel:'#rTitle', delay:400},
    {sel:'#rCard', delay:580},
    {sel:'#resultBtn', delay:780}
  ];
  seq.forEach(s=>{
    setTimeout(()=>{
      const node = el.querySelector(s.sel);
      if(!node) return;
      node.classList.add('show');
      if(s.sel==='#resultBtn') node.disabled=false;
    }, s.delay);
  });

  el.querySelector('#resultBtn').onclick = ()=>{ idx++; render(); };
}

/* ---- Question rendering ---- */
function renderQ(el, q, phase){
  const arr = phase==='q1'?step1:step2;
  const posInArr = arr.indexOf(q);
  el.innerHTML = `
    <div class="q-eyebrow-row">
      <div class="q-eyebrow">${phase==='q1' ? 'My Energy Battery' : 'Fattori Energy Battery'} · ${posInArr+1}/${arr.length}</div>
      ${phase==='q1' ? `<div class="q-eyebrow-badge">${q.id==='descrizione' ? 'ULTIMO ANNO' : 'OGGI'}</div>` : ''}
    </div>
    <div class="q-title">${q.title}</div>
    ${q.sub ? `<div class="q-sub">${q.sub}</div>` : ''}
    <div id="qBody"></div>
    <div class="footer-nav">
      <button class="btn ghost" id="backBtn">Indietro</button>
      <button class="btn ${phase==='q2'?'cool':''}" id="nextBtn" disabled>Continua</button>
    </div>
  `;
  const body = el.querySelector('#qBody');
  const nextBtn = el.querySelector('#nextBtn');
  const backBtn = el.querySelector('#backBtn');
  backBtn.onclick = ()=>{ idx--; render(); };
  function goNext(){ idx++; render(); }

  if(q.type==='single-icon' || q.type==='single'){
    const isIcon = q.type==='single-icon';
    const wrap = document.createElement('div'); wrap.className='options';
    q.options.forEach(opt=>{
      const label = isIcon?opt.label:opt;
      const card = document.createElement('div'); card.className='opt-card';
      card.innerHTML = isIcon
        ? `<div class="opt-icon">${opt.icon}</div><div class="opt-text"><b>${opt.label}</b>${opt.desc?`<span>${opt.desc}</span>`:''}</div><div class="opt-check"></div>`
        : `<div class="opt-text" style="flex:1"><b>${opt}</b></div><div class="opt-check"></div>`;
      if(answers[q.id]===label) card.classList.add('selected');
      card.onclick = ()=>{
        answers[q.id]=label;
        [...wrap.children].forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        nextBtn.disabled=false; updateHud();
      };
      wrap.appendChild(card);
    });
    body.appendChild(wrap);
    if(answers[q.id]!==undefined) nextBtn.disabled=false;
  }

  else if(q.type==='multi-icon' || q.type==='multi'){
    const isIcon = q.type==='multi-icon';
    const wrap = document.createElement('div'); wrap.className='options';
    let selected = answers[q.id] ? [...answers[q.id]] : [];
    const altroLabel = isIcon ? (q.options.find(o=>o.hasInput)||{}).label : q.hasInputOn;

    const inputEl = document.createElement('input');
    inputEl.className='altro-input'; inputEl.placeholder='Scrivi qui la tua risposta…'; inputEl.style.display='none';
    inputEl.value = answers[q.id+'_altro'] || '';

    const hint = document.createElement('div');
    hint.className='altro-hint'; hint.style.display='none';
    hint.textContent = '✏️ Scrivi qualcosa per continuare';

    function computeValid(){
      let ok = selected.length>0;
      const altroActive = altroLabel && selected.includes(altroLabel);
      const altroFilled = inputEl.value.trim().length>0;
      if(altroActive) ok = ok && altroFilled;
      hint.style.display = (altroActive && !altroFilled) ? 'block' : 'none';
      nextBtn.disabled = !ok;
    }
    inputEl.oninput = ()=>{ answers[q.id+'_altro']=inputEl.value; computeValid(); };

    function refreshCheck(){
      [...wrap.children].forEach((c,i)=>{
        const opt=q.options[i];
        const label = isIcon?opt.label:opt;
        c.classList.toggle('selected', selected.includes(label));
      });
      answers[q.id] = selected.length? selected: undefined;
      const altroActive = altroLabel && selected.includes(altroLabel);
      inputEl.style.display = altroActive ? 'block' : 'none';
      if(!altroActive) hint.style.display='none';
      computeValid();
      updateHud();
    }

    q.options.forEach(opt=>{
      const label = isIcon?opt.label:opt;
      const card = document.createElement('div'); card.className='opt-card';
      card.innerHTML = isIcon
        ? `<div class="opt-icon">${opt.icon}</div><div class="opt-text"><b>${opt.label}</b></div><div class="opt-check"></div>`
        : `<div class="opt-text" style="flex:1"><b>${opt}</b></div><div class="opt-check"></div>`;
      card.onclick = ()=>{
        const already = selected.includes(label);
        if(already){ selected = selected.filter(x=>x!==label); }
        else {
          if(q.max && selected.length>=q.max) return;
          selected.push(label);
        }
        refreshCheck();
      };
      wrap.appendChild(card);
    });

    const counter = document.createElement('div'); counter.className='counter-pill';
    counter.textContent = q.max ? `Puoi scegliere fino a ${q.max} opzioni` : '';
    body.appendChild(wrap);
    body.appendChild(inputEl);
    body.appendChild(hint);
    if(q.max) body.appendChild(counter);
    refreshCheck();
  }

  else if(q.type==='slider'){
    const wrap = document.createElement('div'); wrap.className='slider-wrap';
    const val = answers[q.id] || 5;
    wrap.innerHTML = `
      <div class="slider-display">
        <div class="mascot-wrap ${mascotAnimClass(val)}" id="slMascot">${mascotSVG(val)}</div>
        <div class="slider-value" id="slVal">${val}/10</div>
        <div class="slider-msg" id="slMsg">${q.messages[val][1]}</div>
      </div>
      <input type="range" min="1" max="10" value="${val}" id="slInput">
      <div class="scale-labels"><span>Bassa</span><span>Media</span><span>Alta</span></div>
    `;
    body.appendChild(wrap);
    const input = wrap.querySelector('#slInput');
    input.oninput = ()=>{
      const v = parseInt(input.value);
      answers[q.id]=v;
      const mascotEl = wrap.querySelector('#slMascot');
      mascotEl.className = 'mascot-wrap ' + mascotAnimClass(v);
      mascotEl.innerHTML = mascotSVG(v);
      wrap.querySelector('#slVal').textContent = v+'/10';
      wrap.querySelector('#slMsg').textContent = q.messages[v][1];
      nextBtn.disabled=false;
    };
    if(answers[q.id]!==undefined) nextBtn.disabled=false;
  }

  else if(q.type==='likert5'){
    const wrap = document.createElement('div');
    const labels = q.scaleLabels || ['Completamente in disaccordo','Completamente in accordo'];
    wrap.innerHTML = `<div class="likert" id="likertRow"></div><div class="likert-labels"><span>${labels[0]}</span><span>${labels[1]}</span></div>`;
    body.appendChild(wrap);
    const row = wrap.querySelector('#likertRow');
    for(let i=1;i<=5;i++){
      const b = document.createElement('button'); b.className='likert-btn'; b.textContent=i;
      if(answers[q.id]===i) b.classList.add('selected');
      b.onclick = ()=>{
        answers[q.id]=i;
        [...row.children].forEach(c=>c.classList.remove('selected'));
        b.classList.add('selected');
        nextBtn.disabled=false; updateHud();
      };
      row.appendChild(b);
    }
    if(answers[q.id]!==undefined) nextBtn.disabled=false;
  }

  else if(q.type==='nps'){
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="nps-grid" id="npsGrid"></div><div class="scale-labels"><span>Per niente probabile</span><span>Estremamente probabile</span></div>`;
    body.appendChild(wrap);
    const grid = wrap.querySelector('#npsGrid');
    for(let i=0;i<=10;i++){
      const b = document.createElement('button'); b.className='nps-btn'; b.textContent=i;
      if(answers[q.id]===i) b.classList.add('selected');
      b.onclick = ()=>{
        answers[q.id]=i;
        [...grid.children].forEach(c=>c.classList.remove('selected'));
        b.classList.add('selected');
        nextBtn.disabled=false; updateHud();
      };
      grid.appendChild(b);
    }
    if(answers[q.id]!==undefined) nextBtn.disabled=false;
  }

  nextBtn.onclick = goNext;
}

render();
</script>
